name: One-time excited mood edge repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-excited-mood-edge.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect and repair source PNG
        run: node scripts/fix-excited-mood-edge.mjs
      - name: Commit only repaired asset and remove one-time helpers
        run: |
          rm .github/workflows/fix-excited-mood-edge.yml scripts/fix-excited-mood-edge.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/illustrations/life/mood-excited.png .github/workflows/fix-excited-mood-edge.yml scripts/fix-excited-mood-edge.mjs
          git diff --cached --quiet && { echo "No asset change produced"; exit 1; }
          git commit -m "fix(life): clean excited mood edge artifact"
          git push origin HEAD:main

# Retry after inspecting the source component bounds.
