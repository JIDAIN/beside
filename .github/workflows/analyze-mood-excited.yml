name: Repair mood excited asset

on:
  push:
    paths:
      - .github/workflows/analyze-mood-excited.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Remove isolated left-edge artifact from source PNG
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');
          const path = 'public/illustrations/life/mood-excited.png';
          const tmp = `${path}.tmp.png`;
          (async () => {
            const meta = await sharp(path).metadata();
            if (meta.format !== 'png' || meta.width !== 256 || meta.height !== 256 || !meta.hasAlpha) {
              throw new Error(`Unexpected excited mood asset metadata: ${JSON.stringify({format:meta.format,width:meta.width,height:meta.height,hasAlpha:meta.hasAlpha})}`);
            }
            const {data, info} = await sharp(path).ensureAlpha().raw().toBuffer({resolveWithObject:true});
            const W=info.width,H=info.height,C=info.channels;
            let removed=0;
            for (let y=111; y<=154; y += 1) {
              for (let x=32; x<=35; x += 1) {
                const offset=(y*W+x)*C;
                if (data[offset+3] !== 0) removed += 1;
                data[offset]=0; data[offset+1]=0; data[offset+2]=0; data[offset+3]=0;
              }
            }
            if (removed !== 106) throw new Error(`Expected 106 artifact pixels, found ${removed}; refusing broad edit`);
            await sharp(data,{raw:{width:W,height:H,channels:C}}).png().toFile(tmp);
            fs.renameSync(tmp,path);
            const {data:check,info:checkInfo}=await sharp(path).ensureAlpha().raw().toBuffer({resolveWithObject:true});
            let leftVisible=0;
            for(let y=0;y<checkInfo.height;y++) for(let x=0;x<40;x++) if(check[(y*checkInfo.width+x)*checkInfo.channels+3]!==0) leftVisible++;
            const after=await sharp(path).metadata();
            console.log('repair',JSON.stringify({removed,leftVisible,format:after.format,width:after.width,height:after.height,hasAlpha:after.hasAlpha}));
            if(leftVisible!==0 || after.format!=='png' || after.width!==256 || after.height!==256 || !after.hasAlpha) throw new Error('Repair verification failed');
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - name: Commit repaired PNG
        run: |
          git config user.name "JIDAIN"
          git config user.email "43210783+JIDAIN@users.noreply.github.com"
          git add public/illustrations/life/mood-excited.png
          git diff --cached --quiet && exit 1
          git commit -m "fix(life): clean excited mood edge artifact"
          git push origin HEAD:main
